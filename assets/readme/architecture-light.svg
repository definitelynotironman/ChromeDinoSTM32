<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 158" role="img" aria-label="Buttons to debounce to game engine to LCD frame." shape-rendering="crispEdges"><title>Buttons to debounce to game engine to LCD frame.</title><rect x="4" y="15" width="218" height="100" fill="#f5f3e9" stroke="#d4dcc6" stroke-width="2"/><rect x="4" y="15" width="6" height="100" fill="#a5c85a"/><text x="22" y="52" font-family="monospace" font-size="16" font-weight="bold" fill="#26342c">BUTTONS</text><text x="22" y="83" font-family="monospace" font-size="13" fill="#65715e">press / hold</text><path d="M232 65h15m-6 -6 6 6 -6 6" fill="none" stroke="#26342c" stroke-width="3"/><rect x="258" y="15" width="218" height="100" fill="#f5f3e9" stroke="#d4dcc6" stroke-width="2"/><rect x="258" y="15" width="6" height="100" fill="#a5c85a"/><text x="276" y="52" font-family="monospace" font-size="16" font-weight="bold" fill="#26342c">DEBOUNCE</text><text x="276" y="83" font-family="monospace" font-size="13" fill="#65715e">stable edges</text><path d="M486 65h15m-6 -6 6 6 -6 6" fill="none" stroke="#26342c" stroke-width="3"/><rect x="512" y="15" width="218" height="100" fill="#f5f3e9" stroke="#d4dcc6" stroke-width="2"/><rect x="512" y="15" width="6" height="100" fill="#a5c85a"/><text x="530" y="52" font-family="monospace" font-size="16" font-weight="bold" fill="#26342c">DINO GAME</text><text x="530" y="83" font-family="monospace" font-size="13" fill="#65715e">20 ms steps</text><path d="M740 65h15m-6 -6 6 6 -6 6" fill="none" stroke="#26342c" stroke-width="3"/><rect x="766" y="15" width="218" height="100" fill="#f5f3e9" stroke="#d4dcc6" stroke-width="2"/><rect x="766" y="15" width="6" height="100" fill="#a5c85a"/><text x="784" y="52" font-family="monospace" font-size="16" font-weight="bold" fill="#26342c">LCD FRAME</text><text x="784" y="83" font-family="monospace" font-size="13" fill="#65715e">32 raw bytes</text><text x="500" y="144" text-anchor="middle" font-family="monospace" font-size="12" fill="#65715e">SAME GAME ENGINE ON THE BOARD AND IN THE DESKTOP SIMULATOR</text></svg>
